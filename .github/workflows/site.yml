name: Update stories and publish site

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours (UTC)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Look for new stories on Sean's Courant author page
        if: github.event_name != 'push'
        run: python3 -I scripts/update_stories.py

      - name: Save new stories to the repo
        if: github.event_name != 'push'
        run: |
          if git diff --quiet -- site/stories.json; then
            echo "No new stories."
          else
            git config user.name "seankrofssik-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add site/stories.json
            git commit -m "Add new stories"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
